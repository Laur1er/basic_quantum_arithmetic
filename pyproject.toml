[build-system]
requires = ["flit_core >=3.11,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "basic_quantum_arithmetic"
authors = [{name = "Laurier Perron", email = "perl2548@usherbrooke.ca"}]
license = {file = "LICENSE"}
dynamic = ["version", "description"]
requires-python = ">=3.10"
keywords = ["quantum", "computing", "arithmetic", "qiskit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "qiskit>=2.4",
    "qiskit-aer>=0.17",
    "numpy>=2.0",
    "matplotlib>=3.10",
    "pylatexenc>=2.10",
]

[project.optional-dependencies]
dev = ["pytest>=9.0", "flit>=3.12"]

[project.urls]
Home = "https://github.com/Laur1er/basic_quantum_arithmetic"